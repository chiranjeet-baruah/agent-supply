name: Validate catalog

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

# Queue main runs before checks to keep releases in run order.
concurrency:
  group: ${{ github.event_name == 'push' && 'agent-supply-main' || github.run_id }}
  queue: max

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Python version
        run: python3 --version
      - name: Validate registry and catalog
        run: python3 tooling/validate.py
      - name: Validate marketplace packages
        run: python3 -m tooling.package_plugins
      - name: Run validator tests
        run: python3 -m unittest discover -s tests -v

  skillspector:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: false
      - name: Audit locked CI dependencies
        run: uv audit --locked --no-dev
      - name: Install locked SkillSpector
        run: uv sync --locked --no-dev --python python3.12
      - name: Scan every skill
        run: |
          set -euo pipefail
          for manifest in skills/*/SKILL.md; do
            test -f "$manifest"
            .venv/bin/skillspector scan "${manifest%/SKILL.md}" \
              --no-llm --fail-on-findings --fail-on-incomplete --min-coverage 100
          done

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, skillspector]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish next patch release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          existing_tags=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.target_commitish == \"${GITHUB_SHA}\") | .tag_name")
          if [[ -n "$existing_tags" ]]; then
            echo "Commit ${GITHUB_SHA} already has a release: ${existing_tags}"
            exit 0
          fi

          latest_tag=$(gh release view --json tagName --jq .tagName)
          if [[ ! "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Latest release tag is not vMAJOR.MINOR.PATCH: ${latest_tag}" >&2
            exit 1
          fi
          next_tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((10#${BASH_REMATCH[3]} + 1))"

          comparison=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${latest_tag}...${GITHUB_SHA}" --jq .status)
          if [[ "$comparison" != ahead ]]; then
            echo "Commit ${GITHUB_SHA} is not ahead of ${latest_tag}: ${comparison}" >&2
            exit 1
          fi

          gh release create "$next_tag" \
            --target "$GITHUB_SHA" \
            --title "$next_tag" \
            --generate-notes \
            --notes-start-tag "$latest_tag" \
            --fail-on-no-commits

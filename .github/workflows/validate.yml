name: Validate catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Python version
        run: python3 --version
      - name: Validate registry and catalog
        run: python3 tooling/validate.py
      - name: Run validator tests
        run: python3 -m unittest discover -s tests -v

  skillspector:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned SkillSpector
        run: |
          python3.12 -m venv "$RUNNER_TEMP/skillspector-venv"
          "$RUNNER_TEMP/skillspector-venv/bin/pip" install 'skillspector @ git+https://github.com/NVIDIA/skillspector.git@5edc347c320bd516f8ff38df200a63831bf92e80' # v2.12.0
      - name: Scan every skill
        run: |
          set -euo pipefail
          for manifest in skills/*/SKILL.md; do
            test -f "$manifest"
            "$RUNNER_TEMP/skillspector-venv/bin/skillspector" scan "${manifest%/SKILL.md}" \
              --no-llm --fail-on-findings --fail-on-incomplete --min-coverage 100
          done

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, skillspector]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: agent-supply-release-main
      queue: max
    steps:
      - name: Publish next patch release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          existing_tags=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.target_commitish == \"${GITHUB_SHA}\") | .tag_name")
          if [[ -n "$existing_tags" ]]; then
            echo "Commit ${GITHUB_SHA} already has a release: ${existing_tags}"
            exit 0
          fi

          latest_tag=$(gh release view --json tagName --jq .tagName)
          if [[ ! "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Latest release tag is not vMAJOR.MINOR.PATCH: ${latest_tag}" >&2
            exit 1
          fi

          next_tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((10#${BASH_REMATCH[3]} + 1))"
          gh release create "$next_tag" \
            --target "$GITHUB_SHA" \
            --title "$next_tag" \
            --generate-notes \
            --notes-start-tag "$latest_tag" \
            --fail-on-no-commits
